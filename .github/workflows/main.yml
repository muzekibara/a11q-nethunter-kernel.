
name: A11Q Kernel Source Check

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout A11F kernel source
        uses: actions/checkout@v4
        with:
          repository: veyanmer/android_kernel_samsung_sm-a115f
          path: kernel
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            make \
            gcc \
            g++ \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            python3 \
            device-tree-compiler

      - name: Inspect kernel source
        working-directory: kernel
        run: |
          set -e

          echo "===== SOURCE ROOT ====="
          ls -la

          echo "===== KERNEL VERSION ====="
          head -40 Makefile

          echo "===== A11 CONFIGS ====="
          find arch/arm64/configs -type f \
            | grep -Ei 'a11|a115|qcom' || true

          echo "===== PRIMA DRIVER FILES ====="
          find drivers/staging/prima -maxdepth 4 \
            \( -name Makefile -o -name Kconfig \
            -o -name Android.mk \) -print

          echo "===== KERNEL CONFIG FILES ====="
          find . -maxdepth 3 -name '*defconfig' -print \
            | head -80

      - name: Save inspection report
        if: always()
        run: |
          echo "Source inspection workflow completed." \
            > inspection-report.txt

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11q-inspection-report
          path: inspection-report.txt
